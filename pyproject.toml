[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturabot"
version = "0.1.0"
description = "A bilingual Discord reading-session assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.uv]
package = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecturabot = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
