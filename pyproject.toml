[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturabot"
version = "0.1.0"
description = "A bilingual Discord reading-session assistant proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",
    "emoji>=2.15,<3",
]

[project.scripts]
lecturabot = "lecturabot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecturabot = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
